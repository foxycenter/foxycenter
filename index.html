<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOXYCENTER</title>
<style>
body{background:#0a0a0f;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:40px 20px}
h1{font-size:32px}h1 span{color:#ff6a00}
p{color:#8b8ba3;font-size:14px;margin:10px 0 24px}
appkit-button{display:flex;justify-content:center}
small{color:#666;font-size:12px;display:block;margin-top:24px}
</style>
</head>
<body>
<h1><span>FOXYCENTER</span></h1>
<p>Prueba de conexión</p>
<appkit-button></appkit-button>
<small>Usas tus propios fondos. FOXYCENTER no custodia fondos.</small>
<script type="module">
import { createAppKit } from 'https://esm.sh/@reown/appkit@1.7.9?bundle';
import { WagmiAdapter } from 'https://esm.sh/@reown/appkit-adapter-wagmi@1.7.9?bundle';
import { mainnet, bsc, base, polygon, arbitrum, optimism } from 'https://esm.sh/@reown/appkit@1.7.9/networks?bundle';
const projectId = '1c91a6338afae84a70f8f68395b6e205';
const networks = [mainnet, bsc, base, polygon, arbitrum, optimism];
const wagmiAdapter = new WagmiAdapter({ networks, projectId, ssr: false });
createAppKit({
adapters: [wagmiAdapter],
networks,
projectId,
metadata: { name: 'FOXYCENTER', description: 'FOXYSwap - Swap privado', url: 'https://www.foxycenter.org', icons: ['https://www.foxycenter.org/favicon.ico'] },
themeMode: 'dark',
themeVariables: { '--w3m-accent': '#ff6a00' }
});
</script>
</body>
</html>
