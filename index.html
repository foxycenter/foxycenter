<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOXYCENTER</title>
<style>body{font-family:system-ui,sans-serif;padding:24px;max-width:520px;margin:auto}button{padding:12px 18px;font-size:16px;border-radius:10px;border:0;background:#111;color:#fff;cursor:pointer}#status{margin-top:16px;word-break:break-all}</style>
</head>
<body>
<h1>FOXYCENTER</h1>
<p>Prueba de conexión - Ethereum + BNB + Polygon + Base + Arbitrum</p>
<button id="connect">Connect Wallet</button>
<p id="status">Sin conectar</p>
<script type="module">
import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.21.0";
const statusEl = document.getElementById('status');
const btn = document.getElementById('connect');
let provider = null;
async function getProvider(){
  if(provider) return provider;
  provider = await EthereumProvider.init({
    projectId: "1c91a6338afae84a70f8f68395b6e205",
    chains: [1, 56, 137, 8453, 42161],
    optionalChains: [],
    showQrModal: true,
    metadata: {
      name: "FOXYCENTER",
      description: "FOXYCENTER - Prueba de conexión",
      url: "https://www.foxycenter.org",
      icons: ["https://www.foxycenter.org/favicon.ico"]
    }
  });
  return provider;
}
btn.addEventListener('click', async () => {
  try{
    statusEl.textContent = "Abriendo QR... escanea con Trust en Ethereum o BNB Chain";
    const p = await getProvider();
    await p.connect();
    const addr = p.accounts && p.accounts[0] ? p.accounts[0] : p.address;
    statusEl.textContent = "Conectado: " + addr;
    btn.textContent = "Conectado";
  }catch(e){
    statusEl.textContent = "Error: " + (e && e.message ? e.message : e);
  }
});
</script>
</body>
</html>
